title: "{brand}: مساعد ذكي لحجز مواعيد الصالونات والعيادات"
description: "يرد {brand} على عملائك بالعربية والإنجليزية من معلوماتك أنت، ويحجز المواعيد التي يؤكدونها بأنفسهم. جرّب العرض المباشر."

hero:
  heading: مكتب استقبالك، بالعربية والإنجليزية
  lead: "يرد {brand} على عملائك في موقعك من معلوماتك أنت، ويحجز المواعيد التي يؤكدونها بأنفسهم."
  secondaryCta: شاهد كيف يعمل
  image:
    src: ../../assets/screens/salon-site-ar.png
    alt: "الدردشة مفتوحة على موقع صالون تجريبي: عميل يسأل بالعامية عن مكان الصالون ومواقف السيارات، والرد يجيب من معلومات الصالون مع مصدرين مرقّمين."

audiences:
  heading: لكل نشاط يعمل بالمواعيد
  items:
    - icon: scissors
      name: الصالونات والحلاقون
      text: الأسعار والمواعيد ومكان الوقوف يُجاب عنها في أي ساعة، وقصّات الشعر تُحجز مع من يقدّمها.
    - icon: stethoscope
      name: العيادات
      text: إجابات من سياساتك أنت، ومواعيد تلتزم بقواعد الإشعار المسبق والإلغاء لديك.
    - icon: barbell
      name: الاستوديوهات
      text: جلسات تُحجز في الأوقات المتاحة فعلًا فقط، حسب ساعات عمل كل مدرّب وإجازاته.

steps:
  heading: ابدأ في ثلاث خطوات
  items:
    - heading: عرّفه بنشاطك
      text: أضف خدماتك بالعربية والإنجليزية، وفريقك وساعات عمله، وقواعد الحجز، والأسئلة الشائعة والسياسات التي يجيب منها.
    - heading: أضف سطرًا واحدًا إلى موقعك
      text: سطر برمجي واحد يضيف زر الدردشة إلى موقعك، ولا يظهر إلا على المواقع التي تحددها.
    - heading: دع عملاءك يتحدثون، وتدخّل متى شئت
      text: تظهر كل محادثة وكل حجز لفريقك، ويمكنه تولي المحادثة والرد بنفسه في أي وقت.
  image:
    src: ../../assets/screens/widget-settings.jpg
    alt: "تبويب الويدجت في لوحة التحكم: مفتاح إظهار الدردشة، والمواقع المسموح لها بعرضها، وسطر التضمين، ومعاينة حية للدردشة."
    caption: لوحة التحكم متوفرة بالإنجليزية حاليًا، أما الدردشة فتتحدث مع عملائك بالعربية والإنجليزية.

proofs:
  heading: مصمَّم حتى لا يخطئ في الأمور المهمة
  sources:
    heading: إجابات مع مصادرها
    text: لا تأتي الردود إلا من أسئلتك الشائعة وسياساتك، مع مصادر مرقّمة. وإن لم يجد ما يناسب، يقول إنه لا يعرف ويعرض التحويل إلى شخص من فريقك.
    image:
      src: ../../assets/screens/widget-answer-ar.jpg
      alt: "عميل يسأل عن موقف السيارات، والرد يقتبس من الأسئلة الشائعة للصالون ويذكرها مصدرًا."
  confirmation:
    heading: العميل يؤكد كل حجز
    text: قبل أي حجز أو تغيير أو إلغاء، يرى العميل التفاصيل ويضغط «تأكيد». وأي طلب يتغير بعد عرضه لا يمكن تنفيذه.
    image:
      src: ../../assets/screens/widget-confirm-ar.jpg
      alt: "بطاقة التأكيد في الدردشة: قص شعر يوم الأحد من 18:00 حتى 18:45 بسعر 120 ريالًا، مع زرّي «تأكيد» و«ليس الآن»."
  doubleBookings:
    heading: لا حجز مزدوج
    text: قاعدة البيانات نفسها ترفض أي حجزين مؤكدين متداخلين لنفس الموظف. ويطلق اختبار طلبات كثيرة على الموعد نفسه في اللحظة ذاتها، فينجح واحد فقط.

closing:
  heading: جرّبه على موقع صالون تجريبي
  text: اسأل دردشة صالون نور أي سؤال بالعربية أو الإنجليزية، أو احجز موعدًا. ثم سجّل الدخول كصالون لترى محادثتك في صندوق الوارد.
