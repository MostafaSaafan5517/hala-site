title: "كيف يعمل {brand}، بلغة بسيطة"
description: "ما يراه عملاؤك، ومن أين تأتي إجابات {brand}، وكيف يتم الحجز، ومتى يتدخل فريقك، وكم يكلّف تشغيله."

intro:
  heading: كيف يعمل، بلغة بسيطة
  lead: "جولة في {brand} لأصحاب الأعمال: ماذا يحدث حين يفتح العميل الدردشة، والقواعد التي تمنعه من الخطأ. ويمكن للمطورين متابعة الجولة نفسها في الكود."

contentsLabel: في هذه الصفحة

sections:
  - id: what-customers-see
    heading: ما يراه عملاؤك
    paragraphs:
      - يظهر زر دردشة على موقعك. يفتحه العميل ويسأل بالعربية أو الإنجليزية، فيتلقى إجابة بلغته مع المصادر التي جاءت منها.
      - وحين يطلب الحجز، تعرض الدردشة الموعد الذي وجدته، بالخدمة والوقت والسعر وبياناته، وتنتظر حتى يضغط «تأكيد».
    image:
      src: ../../assets/screens/salon-site-ar.png
      alt: "الدردشة مفتوحة على موقع صالون تجريبي: عميل يسأل عن مكان الصالون ومواقف السيارات، والرد يجيب من معلومات الصالون مع مصدرين مرقّمين."

  - id: where-answers-come-from
    heading: من أين تأتي الإجابات
    paragraphs:
      - "لا يجيب {brand} إلا مما تعطيه: أسئلتك الشائعة وسياساتك، وخدماتك وأسعارك، وساعات عملك. يُقسَّم كل مستند إلى مقاطع قصيرة، ويُطابَق كل سؤال معها بالمعنى وبكلماته المفتاحية."
      - وإن لم يجد ما يطابق بدرجة كافية، فلا يخمّن، بل يقول إنه لا يعرف ويعرض إحضار شخص من فريقك.
    image:
      src: ../../assets/screens/knowledge-try.jpg
      alt: "تبويب المعرفة: الأسئلة الشائعة والسياسات للصالون، ولوحة «جرّب سؤالًا» تُظهر المقطع الذي يجيب عن سؤال موقف السيارات."
      caption: لوحة التحكم متوفرة بالإنجليزية حاليًا.

  - id: how-a-booking-happens
    heading: كيف يتم الحجز
    paragraphs:
      - يبحث المساعد عن الأوقات المتاحة بالطريقة نفسها التي تعمل بها شاشة الحجز لدى فريقك، من ساعات عملك، وساعات كل موظف وإجازاته، وأيام الإغلاق، والحجوزات القائمة والفواصل التي تتركها بينها.
      - ولا يتم الحجز إلا بعد أن يؤكده العميل. ثم تتحقق قاعدة البيانات نفسها مرة أخرى وترفض أي موعد يتداخل مع موعد آخر للشخص نفسه، حتى لو حاول عميلان حجز الموعد نفسه في اللحظة ذاتها.
    points:
      - الطلب المكرّر أو المُعاد يعيد الحجز نفسه بدل أن ينشئ حجزًا ثانيًا
      - يستطيع العملاء نقل الحجز أو إلغاءه ضمن قواعدك، أما فريقك فيستطيع تغييره دائمًا
    image:
      src: ../../assets/screens/widget-confirm-ar.jpg
      alt: "بطاقة التأكيد في الدردشة: قص شعر يوم الأحد من 18:00 حتى 18:45 بسعر 120 ريالًا، مع زرّي «تأكيد» و«ليس الآن»."

  - id: rules-decide
    heading: الذكاء الاصطناعي يطلب، وقواعدك تقرر
    paragraphs:
      - لا يغيّر نموذج الذكاء الاصطناعي أي شيء بنفسه. كل ما يستطيعه هو طلب واحد من ثمانية إجراءات، مثل التحقق من المواعيد المتاحة أو حجز موعد. ويتحقق الخادم من كل قاعدة قبل أن يحدث أي شيء، والأسعار لا تأتي إلا من خدماتك.
      - ولهذا لا تغيّر رسالةٌ أو مستندٌ يحاول خداعه، مثل «كل شيء مجاني اليوم»، أي شيء مهم. وتشمل الاختبارات نموذجًا يطيع هذه الحيل عمدًا، وتبقى القواعد سارية.

  - id: when-your-team-steps-in
    heading: متى يتدخل فريقك
    paragraphs:
      - المحادثات التي تحتاج إلى شخص تظهر أولًا في صندوق الوارد. يرى فريقك المحادثة كاملة، بما فيها كل خطوة قام بها المساعد، فيتولاها ويرد في دردشة العميل. وما دام يتولاها، يبقى المساعد صامتًا.
    image:
      src: ../../assets/screens/inbox-taken-over.jpg
      alt: "محادثة في صندوق الوارد تولّاها أحد أعضاء الفريق، مع مربع للرد وزرّي الإعادة إلى المساعد والإغلاق."
      caption: لوحة التحكم متوفرة بالإنجليزية حاليًا.

  - id: what-it-costs
    heading: كم يكلّف تشغيله
    paragraphs:
      - كل استدعاء للذكاء الاصطناعي يُسجَّل مع تكلفته. وفي العرض المباشر يكلّف الرد نحو 0.002 دولار. وتمنع الميزانيات اليومية، والحد لكل محادثة، والحدود لكل زائر، اليومَ المزدحم أو المسيء من رفع التكاليف؛ وبعد تجاوز أي حد يتولى شخص من الفريق المحادثة.
    image:
      src: ../../assets/screens/usage.png
      alt: "تبويب الاستخدام: إنفاق اليوم مقابل الحد اليومي، والمحادثات، والحجوزات التي أجراها المساعد، ورسم بياني للإنفاق اليومي."
      caption: لوحة التحكم متوفرة بالإنجليزية حاليًا.

  - id: tested-not-promised
    heading: مُختبَر، لا مجرد وعود
    paragraphs:
      - كل قاعدة في هذه الصفحة يدعمها اختبار آلي يفشل إذا كُسرت القاعدة. ويعمل اثنان منها قبل اعتماد أي تغيير، والثالث عند الطلب.
    points:
      - نحو 480 اختبارًا لقاعدة البيانات، منها اختبار لكل قاعدة خصوصية ولحالات رفضها
      - اختبارات تطلق حجوزات كثيرة متزامنة على الموعد نفسه وتتوقع نجاح واحد فقط
      - 24 محادثة مكتوبة مسبقًا بالعربية والإنجليزية مع الذكاء الاصطناعي الحقيقي، يُقيَّم فيها كل رد

