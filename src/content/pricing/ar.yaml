title: "أسعار {brand}: مثال لمشروع ضمن معرض أعمال"
description: "أسعار تقريبية على سبيل المثال لـ{brand}، وهو مشروع ضمن معرض أعمال وليس للبيع، والتكلفة الحقيقية لتشغيل مساعد حجز ذكي مثله."

intro:
  heading: الأسعار، على سبيل المثال
  lead: "خطتان توضّحان كيف يمكن تسعير منتج مثل {brand}، والأرقام الحقيقية التي تقف خلفهما."

notice: "{brand} مشروع ضمن معرض أعمال: مبني ويعمل، لكنه ليس للبيع، فلا يمكن شراء أي شيء من هذه الصفحة ولا توجد أي فوترة. والأسعار التالية مجرد مثال."

plans:
  - name: الأساسية
    price: 29 دولارًا
    period: شهريًا، سعر على سبيل المثال
    summary: لفرع واحد بفريق صغير.
    features:
      - الدردشة على موقعك، بالعربية والإنجليزية
      - إجابات من أسئلتك الشائعة وسياساتك، مع المصادر
      - حجز المواعيد ونقلها وإلغاؤها بتأكيد العميل
      - صندوق الوارد، مع تولي فريقك للمحادثات
      - مسعّرة على أساس نحو 1,000 رد بالذكاء الاصطناعي شهريًا
  - name: الفريق
    price: 79 دولارًا
    period: شهريًا، سعر على سبيل المثال
    summary: للأنشطة الأكثر ازدحامًا بعدد من الموظفين.
    features:
      - كل ما في الخطة الأساسية
      - مالك ومشرفون وموظفون، لكلٍ صلاحياته
      - تبويب الاستخدام، مع الإنفاق لكل يوم ولكل نموذج
      - حد يومي للإنفاق على الذكاء الاصطناعي
      - مسعّرة على أساس نحو 5,000 رد بالذكاء الاصطناعي شهريًا

costs:
  heading: التكلفة الحقيقية للتشغيل
  text: تترك الأسعار التقريبية أعلاه هامشًا واسعًا، لأن الذكاء الاصطناعي نفسه رخيص وله حدود.
  points:
    - في العرض المباشر يكلّف الرد نحو 0.002 دولار، أي أن 1,000 رد تكلّف نحو دولارين
    - كل استدعاء للذكاء الاصطناعي يُسجَّل مع تكلفته، ويجمعها تبويب الاستخدام لكل يوم
    - ميزانية يومية لكل نشاط وحد لكل محادثة يمنعان التكاليف من الانفلات

closing:
  heading: جرّبه قبل أن تفكر في الأسعار
  text: في العرض المباشر الدردشة الحقيقية على موقع صالون. والأسئلة عن طريقة عمله في نشاطك تجد إجاباتها في صفحة الأسئلة الشائعة.
  faqLink: اقرأ الأسئلة الشائعة
