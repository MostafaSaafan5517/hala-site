title: "مزايا {brand}: إجابات موثّقة وحجوزات حقيقية"
description: "كيف يجيب {brand} من أسئلتك الشائعة، ويحجز في الأوقات المتاحة فعلًا، ويتحدث العربية والإنجليزية، ويحوّل المحادثات لفريقك، ويضبط تكلفة الذكاء الاصطناعي."

intro:
  heading: كل ما يقوم به مكتب الاستقبال في الدردشة، دون ما لا ينبغي له
  lead: "يجيب {brand} عن الأسئلة، ويحجز المواعيد، ويحوّل العملاء إلى فريقك، بالعربية والإنجليزية. وكل جزء مما يلي مبني ويعمل في العرض المباشر."

answers:
  heading: إجابات من معلوماتك أنت
  text: تضيف الأسئلة الشائعة والسياسات بالعربية أو الإنجليزية، فلا يجيب المساعد إلا منها، ويعرض مصادر مرقّمة، ويقول إنه لا يعرف بدل أن يخمّن.
  points:
    - بحث بالمعنى وبالكلمات المفتاحية، مع توحيد أشكال الكتابة العربية
    - مربع «جرّب سؤالًا» يُظهر بالضبط المقاطع التي سيجيب منها
    - الأسعار لا تأتي إلا من خدماتك، ولا تأتي أبدًا من رسالة
  image:
    src: ../../assets/screens/knowledge-try.jpg
    alt: "تبويب المعرفة: الأسئلة الشائعة والسياسات للصالون بالعربية والإنجليزية، ولوحة «جرّب سؤالًا» تعرض المقطع الذي يجيب عن سؤال موقف السيارات."
    caption: لوحة التحكم متوفرة بالإنجليزية حاليًا، والأسئلة الشائعة والسياسات تُكتب بالعربية أو الإنجليزية.

booking:
  heading: أوقات متاحة فعلًا، وحجوزات مؤكَّدة
  text: تُحسب الأوقات المتاحة من ساعات عملك، وساعات كل موظف وإجازاته، وأيام الإغلاق، والحجوزات القائمة وفواصلها، وقواعد الحجز لديك. ويؤكد العميل كل حجز أو تغيير أو إلغاء قبل أن يتم.
  points:
    - التوقيت الصيفي محسوب من قاعدة بيانات المناطق الزمنية
    - الطلب المكرّر أو المُعاد لا يحجز مرتين أبدًا
    - لا يستطيع العميل الإلغاء داخل مهلة الإلغاء، أما فريقك فيستطيع دائمًا
  image:
    src: ../../assets/screens/bookings.jpg
    alt: "تبويب الحجوزات: مواعيد يوم واحد بتوقيت النشاط، مع زر لحجز جديد."
    caption: لوحة التحكم متوفرة بالإنجليزية حاليًا.

languages:
  heading: العربية والإنجليزية على قدم المساواة
  text: يكتب العملاء بأي من اللغتين ويتلقون الرد بلغتهم. وتتحول الدردشة من اليمين إلى اليسار للعربية، ويمكن أن يكون لكل خدمة اسمان بالعربية والإنجليزية.
  images:
    - src: ../../assets/screens/widget-answer-ar.jpg
      alt: "الدردشة بالعربية من اليمين إلى اليسار: سؤال عن موقف السيارات مُجاب عنه من الأسئلة الشائعة للصالون، مع مصدرين."
    - src: ../../assets/screens/widget-answer-en.jpg
      alt: "الدردشة نفسها بالإنجليزية: سؤال عن موقف السيارات مُجاب عنه من الأسئلة الشائعة للصالون، مع مصدره."

inbox:
  heading: فريقك يتدخل متى شاء
  text: تظهر المحادثات التي تنتظر شخصًا أولًا في صندوق الوارد. يقرأ فريقك المحادثة كاملة، بما فيها كل خطوة قام بها المساعد، ثم يتولاها، ويرد في دردشة العميل، أو يعيدها إلى المساعد، أو يغلقها.
  points:
    - ما دام أحد من فريقك يتولى المحادثة، يبقى المساعد صامتًا
    - يستطيع العميل طلب شخص في أي وقت، ويُحوَّل إليه حين لا يعرف المساعد الإجابة
  image:
    src: ../../assets/screens/inbox-taken-over.jpg
    alt: "محادثة في صندوق الوارد تولّاها أحد أعضاء الفريق: نص المحادثة، وخطوة البحث التي قام بها المساعد، ومربع للرد، وزرّا الإعادة إلى المساعد والإغلاق."
    caption: لوحة التحكم متوفرة بالإنجليزية حاليًا.

costs:
  heading: تكاليف تراها وتضع لها حدًا
  text: كل استدعاء للذكاء الاصطناعي يُسجَّل مع عدد الرموز وتكلفته ومدته. وميزانية يومية لكل نشاط، وحد للرموز في كل محادثة، وحدود للطلبات، تضبط اليوم المزدحم أو المسيء؛ وعند تجاوز أي حد لا يُستدعى الذكاء الاصطناعي ويتولى شخص من الفريق المحادثة.
  points:
    - في العرض المباشر، يكلّف الرد نحو 0.002 دولار
    - يعرض تبويب الاستخدام الإنفاق اليومي والحجوزات وطلبات التحدث إلى شخص
  image:
    src: ../../assets/screens/usage.png
    alt: "تبويب الاستخدام: إنفاق اليوم 0.0066 دولار من حد يومي قدره 5 دولارات، ومحادثات الموقع، والحجوزات التي أجراها المساعد، ورسم بياني للإنفاق اليومي."
    caption: لوحة التحكم متوفرة بالإنجليزية حاليًا.

privacy:
  heading: الخصوصية من الأساس
  text: تبقى بيانات العملاء مع النشاط الذي تخصه، والقواعد تفرضها قاعدة البيانات نفسها، لا الأمل في أن يحسن التطبيق التصرف.
  points:
    - بيانات كل نشاط غير مرئية لأي نشاط آخر، وكل قاعدة مُثبتة باختبارات
    - لا يحتاج الزوار إلى حساب، ولا يُخزَّن إلا تجزئة (hash) لرمز الدردشة الخاص بهم
    - تُحسب حدود الطلبات بتجزئة مشفّرة لعنوان IP الزائر، لا بالعنوان نفسه
    - لا يمكن عرض الدردشة إلا على المواقع التي تحددها
    - سجل لا يقبل التعديل يوثّق كل تغيير وكل إجراء يقوم به المساعد

closing:
  heading: شاهد كل جزء وهو يعمل
  text: العرض المباشر موقع صالون بالدردشة الحقيقية. اسأل واحجز، ثم سجّل الدخول كصالون لترى صندوق الوارد والحجوزات والتكاليف.
