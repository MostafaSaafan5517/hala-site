title: "الأسئلة الشائعة عن {brand}: مساعد الحجز الذكي"
description: "إجابات مباشرة عن {brand}: هل يختلق الإجابات، والحجز المزدوج، والتأكيد، واللغات، وفريقك، والتكاليف، والخصوصية، وطريقة إضافته."

intro:
  heading: أسئلة، بإجابات مباشرة
  lead: "ما يسأل عنه أصحاب الأعمال عادةً عن {brand}، بإجابات قصيرة تطابق طريقة عمله الفعلية."

items:
  - question: "هل {brand} منتج يمكنني شراؤه؟"
    answer: "لا. {brand} مشروع ضمن معرض أعمال مصطفى سعفان: مبني بالكامل، والعرض المباشر يعمل على نشر حقيقي، لكنه ليس للبيع. ويوضح هذا الموقع كيف سيُقدَّم للأنشطة التجارية."
  - question: هل يمكن أن يختلق الإجابات؟
    answer: لا يجيب إلا من أسئلتك الشائعة وسياساتك وخدماتك وساعات عملك، ويعرض المصادر التي استخدمها. وإن لم يجد ما يتعلق بالسؤال، يقول إنه لا يعرف ويعرض إحضار شخص من فريقك.
  - question: هل يمكن أن يحجز عميلان الموعد نفسه؟
    answer: لا. ترفض قاعدة البيانات أي حجز مؤكد يتداخل مع حجز آخر للموظف نفسه، حتى لو وصل طلبان في اللحظة ذاتها. وتطلق الاختبارات طلبات كثيرة على الموعد نفسه معًا وتتحقق من نجاح واحد فقط.
  - question: هل يحجز أي شيء دون سؤال العميل؟
    answer: لا. كل حجز أو تغيير أو إلغاء يُعرض على العميل أولًا، بصياغة من بياناتك وبلغته، ولا يتم إلا حين يضغط «تأكيد».
  - question: ما اللغات التي يتحدثها؟
    answer: العربية والإنجليزية. يكتب العملاء بأي من اللغتين ويتلقون الرد بلغتهم، وتتحول الدردشة من اليمين إلى اليسار للعربية. أما لوحة التحكم التي يستخدمها فريقك فهي بالإنجليزية حاليًا.
  - question: هل يستطيع فريقي تولي المحادثة؟
    answer: نعم. تظهر المحادثات التي تحتاج إلى شخص أولًا في صندوق الوارد. يقرأ عضو الفريق المحادثة كاملة ويتولاها ويرد في دردشة العميل، ويبقى المساعد صامتًا حتى يعيدها إليه.
  - question: كيف أضيفه إلى موقعي؟
    answer: ألصق سطرًا برمجيًا واحدًا في موقعك وحدد المواقع المسموح لها بعرضه. يظهر زر دردشة، وتُفتح الدردشة في إطار مستقل، فلا تتعارض مع تصميم موقعك.
  - question: كم يكلّف تشغيل الذكاء الاصطناعي؟
    answer: كل استدعاء للذكاء الاصطناعي يُسجَّل مع تكلفته. وفي العرض المباشر يكلّف الرد نحو 0.002 دولار. وتضبط الميزانية اليومية لكل نشاط، والحدود لكل محادثة ولكل زائر، التكاليف؛ وبعد تجاوز أي حد يتولى شخص من الفريق المحادثة.
  - question: هل يمكن لأحد خداعه للحصول على خصم أو حجز مجاني؟
    answer: لا. الأسعار لا تأتي إلا من خدماتك، والرسائل والمستندات تُعامَل كمعلومات وليس كتعليمات أبدًا. وتشمل الاختبارات ذكاءً اصطناعيًا يتبع هذه الحيل عمدًا، وتبقى الحجوزات ملتزمة بأسعارك وقواعدك.
  - question: من يستطيع رؤية بيانات عملائي؟
    answer: نشاطك فقط. بيانات كل نشاط غير مرئية لأي نشاط آخر، وتفرض ذلك قاعدة البيانات وتتحقق منه الاختبارات. ولا يحتاج الزوار إلى حساب، ولا يُخزَّن رمز الدردشة وعنوان IP الخاص بهم إلا في صورة تجزئة (hash).
